name: bench

# An experiment, never merged: the first build by cargo-solo, cargo-zigbuild and cross on x86_64.
on:
  push:
    branches: [exp/bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cross
      - shell: bash
        run: tests/bench/bench.sh 2>&1 | tee bench.log
      - if: always()
        run: grep '^|' bench.log >> "$GITHUB_STEP_SUMMARY" || true
