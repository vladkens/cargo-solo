name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_FULL: "${{ github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, 'release: v') }}"

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # checks and tests
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
        env:
          PYTHONUTF8: 1 # the scripts read the sources as UTF-8 on Windows too
      - run: make test
      # every package from every mirror: the same from any host, so once
      - if: runner.os == 'Linux'
        run: cargo test -- --ignored

  # the test crates built on each host for every target, their files checked; cmake is the
  # runners', and on Windows ninja
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # the runner context isn't there in a job's env
      - run: echo "CARGO_SOLO_CACHE=$RUNNER_TEMP/cargo-solo" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_SOLO_CACHE }}
          key: cargo-solo-${{ runner.os }}-${{ hashFiles('src/packages.rs') }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run scripts/e2e.py build e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ runner.os }}
          path: e2e/
          if-no-files-found: error

  # every host's binaries run in their OS: Linux in Docker, arm64 through QEMU; Windows as is;
  # Apple's on a Mac, x86_64 through Rosetta
  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-*
          path: e2e
      - run: uv run scripts/e2e.py run e2e

  release:
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e, release]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
        with:
          files: false
