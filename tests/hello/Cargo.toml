[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: built on its own, never as part of cargo-solo.
[workspace]

[dependencies]
aws-lc-rs = { version = "1.19.0", optional = true }
ring = "0.17.14"

[build-dependencies]
cc = "1.11.2"
cmake = "0.1.58"

[features]
aws-lc-rs = ["dep:aws-lc-rs"]

[profile.dev]
debug = false

[target.'cfg(target_os = "macos")'.dependencies]
iana-time-zone = "0.1.65"
security-framework = "3.7.0"
system-configuration = "0.8.0"
